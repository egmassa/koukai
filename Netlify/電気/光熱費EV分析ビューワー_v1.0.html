    <!--
        光熱費・EV 分析ビューワー
        v1.0.0 : 新規作成 (2026-05-04)
          - 光熱費分析システム v1.3t-drive-r1 の分析レポートを移植
          - EV電気代按分システム v4.1-drive の分析レポートを移植
          - 読み取り専用（入力・保存機能なし）
          - Google Drive から energy_unified_*.json を自動読込
    -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <script>
    // ─── Google Drive Manager ──────────────────────────────────────────────────
    const driveManager = {
        clientId: '', folderId: '', accessToken: null, tokenClient: null,
        _loadScript(src) {
            return new Promise((resolve, reject) => {
                if (document.querySelector(`script[src="${src}"]`)) { resolve(); return; }
                const s = document.createElement('script');
                s.src = src; s.onload = resolve; s.onerror = reject;
                document.head.appendChild(s);
            });
        },
        async setup(clientId, folderId) {
            this.clientId = clientId;
            this.folderId = folderId.replace(/^(folders\/|https:\/\/drive\.google\.com\/.*\/folders\/)/, '').trim();
            await this._loadScript('https://apis.google.com/js/api.js');
            await new Promise(resolve => gapi.load('client', resolve));
            await gapi.client.init({ discoveryDocs: ['https://www.googleapis.com/discovery/v1/apis/drive/v3/rest'] });
            await this._loadScript('https://accounts.google.com/gsi/client');
            this.tokenClient = google.accounts.oauth2.initTokenClient({
                client_id: clientId, scope: 'https://www.googleapis.com/auth/drive.readonly', callback: () => {}
            });
        },
        getToken(silent = true) {
            return new Promise((resolve, reject) => {
                let timer = silent ? setTimeout(() => reject(new Error('silent_timeout')), 5000) : null;
                this.tokenClient.callback = (resp) => {
                    if (timer) clearTimeout(timer);
                    if (resp.error) { reject(new Error(resp.error)); return; }
                    this.accessToken = resp.access_token;
                    gapi.client.setToken(resp);
                    resolve(resp.access_token);
                };
                this.tokenClient.requestAccessToken({ prompt: silent ? 'none' : '' });
            });
        },
        async ensureToken() { if (!this.accessToken) await this.getToken(false); },
        async findLatestJson(prefix) {
            await this.ensureToken();
            const resp = await gapi.client.drive.files.list({
                q: `'${this.folderId}' in parents and name contains '${prefix}' and name contains '.json' and trashed=false`,
                orderBy: 'name desc', pageSize: 5, fields: 'files(id,name)'
            });
            const files = resp.result.files || [];
            return files.length > 0 ? files[0] : null;
        },
        async downloadJson(fileId) {
            const resp = await gapi.client.drive.files.get({ fileId, alt: 'media' });
            return JSON.parse(resp.body);
        }
    };
    </script>

<script>
// ═══════════════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════════════
let utilityData = [];
let appData = [];       // EVデータ（元アプリ変数名を維持）
let driveClientId = localStorage.getItem('viewerDriveClientId') || '';
let driveFolderId = localStorage.getItem('viewerDriveFolderId') || '';
let driveStatus = 'disconnected';
let driveLastFile = null;
const DRIVE_PREFIX = 'energy_unified_';

// 光熱費分析用
let analysisFilter = 'electric';
let utilChartInstances = {};

// EV分析用
let currentAggregationMode = 'timeseries';
let chartInstances = {};
let sortConfig = { key: 'yearMonth', direction: 'desc' };

// 統合レポート用
let iCharts = {};

// ═══════════════════════════════════════════════════════════════
// THEME
// ═══════════════════════════════════════════════════════════════
function toggleTheme() {
    const isDark = document.body.dataset.theme === 'dark';
    document.body.dataset.theme = isDark ? 'light' : 'dark';
    document.getElementById('themeBtn').textContent = isDark ? '🌙' : '☀️';
    localStorage.setItem('viewerTheme', document.body.dataset.theme);
    refreshAllCharts();
}
function applyTheme() {
    const t = localStorage.getItem('viewerTheme') || 'light';
    document.body.dataset.theme = t;
    document.getElementById('themeBtn').textContent = t === 'dark' ? '☀️' : '🌙';
}

// ═══════════════════════════════════════════════════════════════
// MAIN TABS
// ═══════════════════════════════════════════════════════════════
function switchMainTab(tabId) {
    document.querySelectorAll('.main-tab').forEach((t, i) => {
        t.classList.toggle('active', ['util-analysis', 'ev-analysis', 'integrated'][i] === tabId);
    });
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    document.getElementById('tab-' + tabId).classList.add('active');
    if (tabId === 'util-analysis' && utilityData.length > 0) renderUtilAnalysis();
    if (tabId === 'ev-analysis' && appData.length > 0) renderAnalysis();
    if (tabId === 'integrated') renderIntegratedReport();
}

// ═══════════════════════════════════════════════════════════════
// DRIVE
// ═══════════════════════════════════════════════════════════════
function toggleDrivePanel() {
    const w = document.getElementById('drivePanelWrapper');
    w.style.display = w.style.display === 'none' ? 'block' : 'none';
}
function updateDriveUI() {
    const badge = document.getElementById('driveStatusBadge');
    const text = document.getElementById('driveStatusText');
    const map = { disconnected: { cls: 'disconnected', label: '未接続' }, connecting: { cls: 'connecting', label: '接続中…' }, connected: { cls: 'connected', label: '接続済み' }, error: { cls: 'disconnected', label: 'エラー' } };
    const s = map[driveStatus] || map.disconnected;
    badge.className = 'drive-badge ' + s.cls;
    text.textContent = s.label;
    const info = document.getElementById('driveInfoText');
    if (info && driveLastFile) info.textContent = '最終読込: ' + driveLastFile.name;
    const cidEl = document.getElementById('driveClientIdInput');
    const fidEl = document.getElementById('driveFolderIdInput');
    if (cidEl && !cidEl.value) cidEl.value = driveClientId;
    if (fidEl && !fidEl.value) fidEl.value = driveFolderId;
}
function saveDriveSettings() {
    const cid = document.getElementById('driveClientIdInput').value.trim();
    const fid = document.getElementById('driveFolderIdInput').value.trim();
    if (!cid || !fid) { alert('Client IDとフォルダIDを入力してください'); return; }
    driveClientId = cid; driveFolderId = fid;
    localStorage.setItem('viewerDriveClientId', cid);
    localStorage.setItem('viewerDriveFolderId', fid);
    alert('設定を保存しました');
}
async function connectDrive() {
    const cid = document.getElementById('driveClientIdInput').value.trim() || driveClientId;
    const fid = document.getElementById('driveFolderIdInput').value.trim() || driveFolderId;
    if (!cid || !fid) { alert('Client IDとフォルダIDを入力してください'); return; }
    const fidClean = fid.replace(/^(folders\/|https:\/\/drive\.google\.com\/.*\/folders\/)/, '').trim();
    driveClientId = cid; driveFolderId = fidClean;
    localStorage.setItem('viewerDriveClientId', cid);
    localStorage.setItem('viewerDriveFolderId', fidClean);
    try {
        driveStatus = 'connecting'; updateDriveUI();
        await driveManager.setup(cid, fidClean);
        await driveManager.getToken(false);
        driveStatus = 'connected'; updateDriveUI();
        await loadFromDrive();
    } catch(e) { driveStatus = 'error'; updateDriveUI(); alert('Drive接続失敗: ' + e.message); }
}
async function loadFromDrive() {
    if (driveStatus !== 'connected') { alert('先にDriveに接続してください'); return; }
    document.getElementById('loadingOverlay').classList.add('show');
    try {
        const file = await driveManager.findLatestJson(DRIVE_PREFIX);
        if (!file) { alert('Driveにデータファイルが見つかりません\n\nenergy_unified_*.json をDriveに保存してください'); return; }
        const data = await driveManager.downloadJson(file.id);
        driveLastFile = file;
        if (data.utility && data.utility.data) {
            utilityData = data.utility.data.map(item => {
                const gc = item.gasCost||0, ec = item.electricCost||0;
                const gu = item.gasUsage||0, eu = item.electricUsage||0;
                return { ...item, totalCost: gc+ec, gasUnitPrice: gu>0?gc/gu:0, electricUnitPrice: eu>0?ec/eu:0 };
            });
        }
        if (data.ev && data.ev.data) {
            appData = normalizeEvData(data.ev.data);
        }
        updateDriveUI();
        // 現在のタブを再描画
        const activeTab = document.querySelector('.main-tab.active');
        const tabs = ['util-analysis', 'ev-analysis', 'integrated'];
        const idx = [...document.querySelectorAll('.main-tab')].indexOf(activeTab);
        if (idx >= 0) switchMainTab(tabs[idx]);
        alert('✅ ' + file.name + ' を読み込みました');
    } catch(e) { alert('Drive読込失敗: ' + e.message); }
    finally { document.getElementById('loadingOverlay').classList.remove('show'); }
}
async function autoConnectDrive() {
    if (!driveClientId || !driveFolderId) return;
    try {
        driveStatus = 'connecting'; updateDriveUI();
        await driveManager.setup(driveClientId, driveFolderId);
        await driveManager.getToken(true);
        driveStatus = 'connected'; updateDriveUI();
        await loadFromDrive();
    } catch(e) { driveStatus = 'disconnected'; updateDriveUI(); }
}

// ═══════════════════════════════════════════════════════════════
// EV DATA NORMALIZATION（元アプリのrecalculateAndSaveDateロジック）
// ═══════════════════════════════════════════════════════════════
function normalizeEvData(data) {
    data.sort((a,b) => a.year*100+a.month - (b.year*100+b.month));
    let prevKwh = null, prevDist = null;
    return data.map(item => {
        const evCarUsage = (prevKwh !== null && item.evCumulativeKwh !== null)
            ? Math.max(0, item.evCumulativeKwh - prevKwh) : (item.evCarUsage||0);
        const evMonthlyDistance = (prevDist !== null && item.evCumulativeDistance !== null)
            ? Math.max(0, item.evCumulativeDistance - prevDist) : (item.evMonthlyDistance||0);
        const evEfficiency = evCarUsage > 0 && evMonthlyDistance > 0 ? evMonthlyDistance / evCarUsage : null;
        const tc = item.evTotalCost||0, tu = item.evTotalUsage||0, bf = item.evBaseFee||0;
        let carCost = item.carElectricCost||0, p1 = item.person1Cost||0, p2 = item.person2Cost||0, kup = item.kwhUnitPrice||0;
        if (tc > 0 && tu > 0) {
            kup = (tc - bf) / tu;
            carCost = evCarUsage * kup;
            const ncc = tc - carCost;
            p1 = ncc / 2; p2 = ncc / 2 + carCost;
        }
        if (item.evCumulativeKwh !== null) prevKwh = item.evCumulativeKwh;
        if (item.evCumulativeDistance !== null) prevDist = item.evCumulativeDistance;
        return { ...item, yearMonth: `${item.year}/${item.month}`, evCarUsage, evMonthlyDistance, evEfficiency, kwhUnitPrice: kup, carElectricCost: carCost, person1Cost: p1, person2Cost: p2, savingsVsGas: null, costPerKm: evMonthlyDistance > 0 ? carCost / evMonthlyDistance : 0, evUsageRatio: tu > 0 ? evCarUsage / tu * 100 : 0 };
    });
}

function getEfficiencyRanking(n) {
    return [...appData].filter(d => d.evEfficiency != null && d.evEfficiency > 0).sort((a,b) => b.evEfficiency - a.evEfficiency).slice(0, n||10);
}

function renderOrUpdateChart(canvasId, config) {
    if (chartInstances[canvasId]) { chartInstances[canvasId].destroy(); }
    const ctx = document.getElementById(canvasId);
    if (!ctx) return;
    chartInstances[canvasId] = new Chart(ctx, config);
}

function generateComment(label, values, unit, higherIsBetter) {
    const valid = values.filter(v => v != null && isFinite(v));
    if (valid.length === 0) return '';
    const avg = valid.reduce((s,v) => s+v, 0) / valid.length;
    const max = Math.max(...valid); const min = Math.min(...valid);
    const last = valid[valid.length-1];
    const allLabels = appData.map(d => d.yearMonth || `${d.year}/${d.month}`);
    const maxLabel = allLabels[values.indexOf(max)];
    const minLabel = allLabels[values.indexOf(min)];
    const trend = last > avg ? (higherIsBetter ? '良好' : '悪化') : (higherIsBetter ? '悪化' : '良好');
    return `<ul style="margin:0;padding-left:16px;"><li>${maxLabel} に最高値 (${max.toLocaleString(undefined,{maximumFractionDigits:2})} ${unit}) を記録しました。</li><li>${minLabel} に最低値 (${min.toLocaleString(undefined,{maximumFractionDigits:2})} ${unit}) を記録しました。</li><li>期間中の平均は ¥${Math.round(avg).toLocaleString()} です。</li><li>直近のデータは平均より<strong>${trend}</strong>です。</li></ul>`;
}

function renderAnalysis() {

        carCostData = years.map(y => { const items = appData.filter(d=>d.year===y&&d.carElectricCost!=null); return items.length>0?Math.round(items.reduce((s,d)=>s+d.carElectricCost,0)/items.length):null; });

        effData = agg('evEfficiency');

    const modeText = mode==='timeseries'?'時系列':mode==='yearly'?'年別集計':'月別比較';

    document.getElementById('comment-box-chart1').innerHTML = evShareData.filter(v=>v!=null).length>0 ? generateComment('按分額', evShareData, '円', false) : '';

    // chart2: EV充電費用
    renderOrUpdateChart('chart2', { type:'bar', data:{ labels, datasets:[
        { label:'EV充電費用', data:carCostData, backgroundColor:'rgba(67,97,238,0.6)', borderColor:'#4361ee', borderWidth:1 },
    ]}, options:{ responsive:true, maintainAspectRatio:false, plugins:{legend:{position:'bottom'},title:{display:true,text:'EV充電費用'}}, scales:{y:{beginAtZero:true}} } });
    document.getElementById('comment-box-chart2').innerHTML = carCostData.filter(v=>v!=null).length>0 ? generateComment('EV充電費用', carCostData, '円', false) : '';

    // chart3: EV充電量
    renderOrUpdateChart('chart3', { type:'bar', data:{ labels, datasets:[
        { label:'EV充電量(kWh)', data:usageData, backgroundColor:'rgba(46,196,182,0.6)', borderColor:'#2ec4b6', borderWidth:1 },
    ]}, options:{ responsive:true, maintainAspectRatio:false, plugins:{legend:{position:'bottom'},title:{display:true,text:'EV充電量'}}, scales:{y:{beginAtZero:true}} } });
    document.getElementById('comment-box-chart3').innerHTML = '';

    // chart4: 電費
    renderOrUpdateChart('chart4', { type:'line', data:{ labels, datasets:[
        { label:'電費(km/kWh)', data:effData, borderColor:'#06d6a0', backgroundColor:'rgba(6,214,160,0.1)', tension:0.3, fill:true, spanGaps:true },
    ]}, options:{ responsive:true, maintainAspectRatio:false, plugins:{legend:{position:'bottom'},title:{display:true,text:'電費(km/kWh)'}}, scales:{y:{beginAtZero:false}} } });

    // chart5: 充電比率
    renderOrUpdateChart('chart5', { type:'bar', data:{ labels, datasets:[
        { label:'EV充電比率(%)', data:usageRatioData, backgroundColor:'rgba(131,56,236,0.6)', borderColor:'#8338ec', borderWidth:1 },
    ]}, options:{ responsive:true, maintainAspectRatio:false, plugins:{legend:{position:'bottom'},title:{display:true,text:'EV充電比率(%)'}}, scales:{y:{beginAtZero:true,max:100}} } });
    document.getElementById('comment-box-chart5').innerHTML = '';

    // 追加分析（newAnalysisContent）
    renderNewMetricsCharts(labels, costPerKmData, usageRatioData, modeText);
}

function renderNewMetricsCharts(labels, costPerKmData, usageRatioData, modeText) {
    const container = document.getElementById('newAnalysisContent');

    const validEff = appData.filter(d=>d.evEfficiency>0).map(d=>d.evEfficiency);

    const totalCarCost = Math.round(appData.reduce((s,d)=>s+(d.carElectricCost||0),0));
    const avgShare = appData.filter(d=>d.evUsageRatio>0).length>0 ? (appData.filter(d=>d.evUsageRatio>0).reduce((s,d)=>s+d.evUsageRatio,0)/appData.filter(d=>d.evUsageRatio>0).length).toFixed(1) : '--';

    // ランキング
    const ranking = getEfficiencyRanking(10);
    const rankingHtml = ranking.length > 0 ? `
        <div class="analysis-section">
            <h2>🏆 電費効率ランキング (上位10)</h2>
            <table class="ranking-table">
                <thead><tr><th>順位</th><th>年月</th><th>電費(km/kWh)</th><th>走行距離(km)</th><th>充電量(kWh)</th><th>按分額(EV)</th></tr></thead>
                <tbody>${ranking.map((d,i) => `<tr>
                    <td><span class="rank-badge rank-${i<3?i+1:'other'}">${i+1}</span></td>
                    <td>${d.yearMonth||`${d.year}/${d.month}`}</td>
                    <td><strong>${d.evEfficiency!=null?d.evEfficiency.toFixed(2):'--'}</strong></td>
                    <td>${d.evMonthlyDistance!=null?d.evMonthlyDistance.toFixed(1):'--'}</td>
                    <td>${d.evCarUsage!=null?d.evCarUsage.toFixed(2):'--'}</td>
                    <td>¥${d.person2Cost!=null?Math.round(d.person2Cost).toLocaleString():'--'}</td>
                </tr>`).join('')}</tbody>
            </table>
        </div>` : '';

    container.innerHTML = `
        <div class="metrics-grid">
            <div class="metric-card"><div class="metric-value">${avgEff}</div><div class="metric-label">平均電費(km/kWh)</div></div>
            <div class="metric-card"><div class="metric-value">${maxEff}</div><div class="metric-label">最高電費(km/kWh)</div></div>
            <div class="metric-card"><div class="metric-value">¥${totalCarCost.toLocaleString()}</div><div class="metric-label">EV電気代累計</div></div>
            <div class="metric-card"><div class="metric-value">${avgShare}%</div><div class="metric-label">平均EV充電比率</div></div>
        </div>
        ${rankingHtml}
        <div class="analysis-section">
            <h2>💰 EV充電コスト効率 (円/km) - ${modeText}</h2>
            <div class="chart-container" id="ev-analysis-content"><canvas id="cost-per-km-chart"></canvas></div>
            <div class="analysis-comment-box" id="comment-box-cost-per-km"></div>
        </div>
        <div class="analysis-section">
            <h2>🔋 家庭内EV充電比率 (%) - ${modeText}</h2>
            <div class="chart-container"><canvas id="ev-usage-ratio-chart"></canvas></div>
            <div class="analysis-comment-box" id="comment-box-ev-usage-ratio"></div>
        </div>`;

    setTimeout(() => {
        renderOrUpdateChart('cost-per-km-chart', { type:'line', data:{ labels, datasets:[{ label:'円/km', data:costPerKmData, borderColor:'#ff9f1c', backgroundColor:'rgba(255,159,28,0.1)', tension:0.3, fill:true, spanGaps:true }]}, options:{ responsive:true, maintainAspectRatio:false, plugins:{legend:{position:'bottom'}}, scales:{y:{beginAtZero:true}} } });
        renderOrUpdateChart('ev-usage-ratio-chart', { type:'bar', data:{ labels, datasets:[{ label:'充電比率(%)', data:usageRatioData, backgroundColor:'rgba(131,56,236,0.6)', borderColor:'#8338ec', borderWidth:1 }]}, options:{ responsive:true, maintainAspectRatio:false, plugins:{legend:{position:'bottom'}}, scales:{y:{beginAtZero:true,max:100}} } });
    }, 50);
}

// ═══════════════════════════════════════════════════════════════
// 統合レポート
// ═══════════════════════════════════════════════════════════════
function renderIntegratedReport() {
    renderIntegratedSummary();
    renderIntegratedCharts();
}
function renderIntegratedSummary() {
    const grid = document.getElementById('integratedSummary');
    if (!grid) return;
    if (utilityData.length === 0 && appData.length === 0) { grid.innerHTML = ''; return; }
    const totalElec = utilityData.reduce((s,d)=>s+(d.electricCost||0),0);
    const totalGas = utilityData.reduce((s,d)=>s+(d.gasCost||0),0);
    const totalEv = appData.reduce((s,d)=>s+(d.carElectricCost||0),0);
    const avgEup = utilityData.filter(d=>d.electricUnitPrice>0).reduce((s,d)=>s+(d.electricUnitPrice||0),0)/(utilityData.filter(d=>d.electricUnitPrice>0).length||1);
    const effVals = appData.filter(d=>d.evEfficiency>0).map(d=>d.evEfficiency);
    const avgEff = effVals.length>0 ? effVals.reduce((s,v)=>s+v,0)/effVals.length : 0;
    grid.innerHTML = [
        { label:'電気費用合計', value:'¥'+Math.round(totalElec).toLocaleString(), unit:'全期間' },
        { label:'ガス費用合計', value:'¥'+Math.round(totalGas).toLocaleString(), unit:'全期間' },
        { label:'EV電気代合計', value:'¥'+Math.round(totalEv).toLocaleString(), unit:'全期間' },
        { label:'総光熱費', value:'¥'+Math.round(totalElec+totalGas).toLocaleString(), unit:'全期間' },
        { label:'平均電気単価', value:avgEup.toFixed(2), unit:'円/kWh' },
        { label:'平均電費', value:avgEff>0?avgEff.toFixed(2):'--', unit:'km/kWh' },
    ].map(c=>`<div class="summary-card"><div class="summary-label">${c.label}</div><div class="summary-value">${c.value}</div><div class="summary-unit">${c.unit}</div></div>`).join('');
}
function renderIntegratedCharts() {
    if (utilityData.length===0) return;
    const isDark = document.body.dataset.theme === 'dark';
    Chart.defaults.color = isDark ? '#94a3b8' : '#718096';
    Object.keys(iCharts).forEach(k => { if(iCharts[k]) { iCharts[k].destroy(); delete iCharts[k]; } });

    const yr = parseInt(document.getElementById('integratedYearRange')?.value||'3');
    const allYears = [...new Set(utilityData.map(d=>d.year))].sort();
    const maxY = Math.max(...allYears);
    const filtYears = yr===0 ? allYears : allYears.filter(y=>y>=maxY-yr+1);
    const sortedU = [...utilityData].filter(d=>filtYears.includes(d.year)).sort((a,b)=>a.year*100+a.month-(b.year*100+b.month));
    const labels = sortedU.map(d=>`${d.year}/${d.month}`);
    const evMap = {};
    appData.forEach(d => { evMap[`${d.year}-${d.month}`] = d; });

    // 積み上げ
    iCharts['stack'] = new Chart(document.getElementById('integratedStackChart'), { type:'bar', data:{ labels, datasets:[
        { label:'ガス費用', data:sortedU.map(d=>d.gasCost||0), backgroundColor:'#f59e0b', stack:'c' },
        { label:'EV電気代', data:sortedU.map(d=>{ const e=evMap[`${d.year}-${d.month}`]; return e?Math.round(e.carElectricCost||0):0; }), backgroundColor:'#7c3aed', stack:'c' },
        { label:'電気(EV以外)', data:sortedU.map(d=>{ const e=evMap[`${d.year}-${d.month}`]; const ev=e?(e.carElectricCost||0):0; return Math.round((d.electricCost||0)-ev); }), backgroundColor:'#3b82f6', stack:'c' },
    ]}, options:{ responsive:true, maintainAspectRatio:false, plugins:{legend:{position:'bottom'}}, scales:{x:{stacked:true},y:{stacked:true,beginAtZero:true}} } });

    // 年間合計
    const annualTotals = allYears.map(y=>{ const yd=utilityData.filter(d=>d.year===y); return { year:y, total:yd.reduce((s,d)=>s+(d.totalCost||0),0), elec:yd.reduce((s,d)=>s+(d.electricCost||0),0), gas:yd.reduce((s,d)=>s+(d.gasCost||0),0) }; });
    iCharts['annual'] = new Chart(document.getElementById('integratedAnnualChart'), { type:'bar', data:{ labels:annualTotals.map(d=>d.year+'年'), datasets:[
        { label:'ガス費用', data:annualTotals.map(d=>Math.round(d.gas)), backgroundColor:'#f59e0b' },
        { label:'電気費用', data:annualTotals.map(d=>Math.round(d.elec)), backgroundColor:'#3b82f6' },
        { label:'合計', data:annualTotals.map(d=>Math.round(d.total)), type:'line', borderColor:'#ef4444', backgroundColor:'transparent', tension:0.3, pointRadius:4 },
    ]}, options:{ responsive:true, maintainAspectRatio:false, plugins:{legend:{position:'bottom'}}, scales:{y:{beginAtZero:true}} } });

    // 電気単価
    iCharts['unit'] = new Chart(document.getElementById('integratedUnitChart'), { type:'line', data:{ labels, datasets:[{ label:'電気単価(円/kWh)', data:sortedU.map(d=>d.electricUnitPrice||null), borderColor:'#3b82f6', backgroundColor:'rgba(59,130,246,0.1)', tension:0.3, pointRadius:2, fill:true, spanGaps:true }]}, options:{ responsive:true, maintainAspectRatio:false, plugins:{legend:{position:'bottom'}} } });

    // 電費
    const sortedEv = [...appData].filter(d=>filtYears.includes(d.year)).sort((a,b)=>a.year*100+a.month-(b.year*100+b.month));
    if (sortedEv.length>0) {
        iCharts['eff'] = new Chart(document.getElementById('integratedEffChart'), { type:'line', data:{ labels:sortedEv.map(d=>`${d.year}/${d.month}`), datasets:[{ label:'電費(km/kWh)', data:sortedEv.map(d=>d.evEfficiency>0?parseFloat(d.evEfficiency.toFixed(2)):null), borderColor:'#10b981', backgroundColor:'rgba(16,185,129,0.1)', tension:0.3, pointRadius:2, fill:true, spanGaps:true }]}, options:{ responsive:true, maintainAspectRatio:false, plugins:{legend:{position:'bottom'}} } });
    }

    // EV充電比率
    iCharts['ratio'] = new Chart(document.getElementById('integratedRatioChart'), { type:'bar', data:{ labels, datasets:[{ label:'EV充電比率(%)', data:sortedU.map(d=>{ const e=evMap[`${d.year}-${d.month}`]; return e&&d.electricUsage>0?parseFloat(((e.evCarUsage||0)/d.electricUsage*100).toFixed(1)):null; }), backgroundColor:'rgba(124,58,237,0.6)', borderColor:'#7c3aed', borderWidth:1 }]}, options:{ responsive:true, maintainAspectRatio:false, plugins:{legend:{position:'bottom'}}, scales:{y:{beginAtZero:true,max:100,ticks:{callback:v=>v+'%'}}} } });
}

function refreshAllCharts() {
    Chart.defaults.color = document.body.dataset.theme==='dark' ? '#94a3b8' : '#718096';
    if (document.getElementById('tab-util-analysis').classList.contains('active')) renderUtilAnalysis();
    if (document.getElementById('tab-ev-analysis').classList.contains('active')) renderAnalysis();
    if (document.getElementById('tab-integrated').classList.contains('active')) renderIntegratedCharts();
}
